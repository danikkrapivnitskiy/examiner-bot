name: CI/CD Pipeline

# Optimized for free tier (2000 min/month for private repos)
# Runs on: main branch, PRs to main, weekly schedule, manual trigger
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan (every Monday at 2 AM UTC)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Manual trigger for on-demand runs

jobs:
  # ============================================
  # Job 1: Code Quality Checks
  # ============================================
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Validate Configuration Schema
        run: npm run config:validate

  # ============================================
  # Job 2: Unit Tests
  # ============================================
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        env:
          NODE_OPTIONS: --experimental-vm-modules

  # ============================================
  # Job 3: Security Audit
  # ============================================
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --json > npm-audit.json || true
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 7

  # ============================================
  # Job 4: Build Docker Image
  # ============================================
  build-image:
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, security-audit]
    if: |
      always() && 
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.quality.result == 'success' &&
      needs.unit-tests.result == 'success'
    env:
      DOCKER_IMAGE: examiner-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get build date
        id: build-date
        run: |
          if [ -n "${{ github.event.head_commit.timestamp }}" ]; then
            BUILD_DATE="${{ github.event.head_commit.timestamp }}"
          else
            BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Build Docker image (local only, no push)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.build-date.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
            REPOSITORY_URL=https://github.com/${{ github.repository }}

      - name: Check image size
        if: steps.build.outcome == 'success'
        run: |
          sleep 2
          FORMAT='{{.Size}}'
          IMAGE_SIZE=$(docker images --format "$FORMAT" ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }} 2>/dev/null | sed 's/[^0-9.]//g' | head -1 || echo "")
          if [ -n "$IMAGE_SIZE" ]; then
            echo "Image size: $IMAGE_SIZE"
          else
            echo "⚠️ Could not determine image size"
          fi

  # ============================================
  # Job 5: Test Docker Image
  # ============================================
  test-docker-image:
    runs-on: ubuntu-latest
    needs: [build-image]
    continue-on-error: true
    env:
      DOCKER_IMAGE: examiner-bot
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image for testing (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image health check
        run: |
          CONTAINER_ID=$(docker run -d \
            --name test-container \
            -p 3000:3000 \
            -e USE_TEST_ENVIRONMENT=false \
            -e APP_MODE=api \
            -e TELEGRAM_BOT_TOKEN=123456789:test-token-for-ci \
            -e WEBHOOK_URL=https://test.example.com/webhook \
            -e OPENAI_API_KEY=sk-test-key-for-ci \
            -e REDIS_URL=redis://dummy:6379 \
            -e REDIS_ENABLED=false \
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }})

          echo "Container started: $CONTAINER_ID"
          sleep 15

          if ! docker ps | grep -q test-container; then
            echo "⚠️ Container failed to start"
            docker logs test-container 2>&1 || true
            exit 0
          fi

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s http://localhost:3000/health > /dev/null; then
              echo "✅ Health check passed"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 5
          done

          docker stop test-container
          docker rm test-container
