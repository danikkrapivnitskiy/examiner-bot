services:
  bot-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: examiner-bot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - USE_TEST_ENVIRONMENT=false
      - APP_MODE=api
    volumes:
      - exam_logs:/app/logs # Named volume for logs
      - exam_tmp:/app/tmp # Named volume for tmp directory
    networks:
      - bot-network
      - proxy-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  exam-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: node dist/index.js
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - USE_TEST_ENVIRONMENT=false
      - APP_MODE=worker
    volumes:
      - exam_logs:/app/logs # Named volume for logs
      - exam_tmp:/app/tmp # Named volume for tmp directory
    networks:
      - bot-network
      - proxy-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # No HTTP server in worker mode, so we remove healthcheck that Docker seems to inherit/apply
    healthcheck:
      disable: true
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  bot-network:
    driver: bridge
  proxy-network:
    external: true
    name: proxy-network

volumes:
  exam_tmp:
    # Named volume for /app/tmp to fix permission issues and improve performance
  exam_logs:
    # Named volume for /app/logs to fix permission issues
